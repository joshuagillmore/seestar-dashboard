[project]
name = "seestar-sidecar"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.121.2",
  "uvicorn==0.41.0",
  "mcp[cli]==1.28.1",
  "httpx==0.28.1",
]

[project.scripts]
seestar-dashboard = "seestar_sidecar.launcher:main"

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seestar_sidecar"]
