[project]
name = "seestar-sidecar"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  # fastapi 0.121 pinned starlette<0.50, which strands us on 0.49.3 — and
  # PYSEC-2026-2281 (StaticFiles UNC SSRF on Windows) applies to this app,
  # which serves web/dist through StaticFiles on Windows. 0.141 dropped the
  # upper bound, so starlette is pinned directly below.
  "fastapi==0.141.1",
  "starlette==1.3.1",
  "uvicorn==0.41.0",
  # Base package, not mcp[cli]: the `cli` extra exists to install typer for
  # the `mcp` command-line tool, which nothing here runs. We use
  # ClientSession/StdioServerParameters/stdio_client, and tests/stub_mcp_
  # server.py uses mcp.server.fastmcp — all of which are in the base package.
  "mcp==1.28.1",
  "httpx==0.28.1",
  "python-dotenv==1.2.2",
  # Transitive (mcp -> pyjwt[crypto]); pinned only to clear PYSEC-2026-3552,
  # a PKCS7 decryption oracle. Nothing here decrypts PKCS7, so this is
  # hygiene rather than exposure — but the fix costs a version bump.
  "cryptography>=50.0.0",
]

[project.scripts]
seestar-dashboard = "seestar_sidecar.launcher:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seestar_sidecar"]

[tool.ruff.lint]
# Correctness only: pyflakes, syntax errors, bugbear and async-blocking. Style is
# not gated, so the rule set stays one every existing line already meets.
select = ["F", "E9", "B", "ASYNC"]
